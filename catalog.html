<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kobblins Catalog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Global Header -->
  <header class="site-header">
    <a href="index.html" class="home-link">
      <h1>Kobblins</h1>
      <img src="images/kobblin.png" alt="Kobblin mascot" class="kobblin-img">
    </a>

    <p class="tagline"><em>A world of hidden painted rocks waiting to be discovered.</em></p>

    <nav class="navbar">
      <a href="about.html">About</a>
      <a href="catalog.html">Catalog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <!-- Genesis Collection -->
    <div class="collection">
      <div class="collection-header" onclick="toggleList('genesis')">
        <div class="collection-title">Genesis</div>
        <p class="collection-subtitle"><em>The launch collection (Fall 2026).</em></p>
      </div>

      <div id="genesis" class="kobblin-list"></div>

    </div>

    <!-- Apingaut Collection -->
    <div class="collection">
      <div class="collection-header" onclick="toggleList('apingaut')">
        <div class="collection-title">Apingaut (The First Snow)</div>
        <p class="collection-subtitle"><em>Winter 2026 collection.</em></p>
      </div>

      <div id="apingaut" class="kobblin-list">
        <p>(Add kobblins later)</p>
      </div>
    </div>

    <!-- Rogues Gallery #1 -->
    <div class="collection">
      <div class="collection-header" onclick="toggleList('rogues')">
        <div class="collection-title">Rogues Gallery #1</div>
        <p class="collection-subtitle"><em>A collection of Kobblins up to no good.</em></p>
      </div>

      <div id="rogues" class="kobblin-list">
        <p>(Add kobblins later)</p>
      </div>
    </div>

  </main>

  <script>
    // Toggle a collection by id — toggles .open on the .collection element (no inline display)
    function toggleList(id) {
      const list = document.getElementById(id);
      if (!list) return;
      const collection = list.closest('.collection');
      if (!collection) return;
      const isOpen = collection.classList.toggle('open');
      const header = collection.querySelector('.collection-header');
      if (header) header.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }

    // Utility: create slug from name for image filenames
    function slugFromName(name) {
      return (name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    // Ordered Genesis kobblins data (use ids to match DB reliably)
    const genesisKobblins = [
      {id:'GEN001', name:'Glimmer', number:'01/23'},
      {id:'GEN002', name:'Pebble',  number:'02/23'},
      {id:'GEN003', name:'Milo',    number:'03/23'},
      {id:'GEN004', name:'Mossy',   number:'04/23'},
      {id:'GEN005', name:'Pip',     number:'05/23'},
      {id:'GEN006', name:'Bramble', number:'06/23'},
      {id:'GEN007', name:'Flint',   number:'07/23'},
      {id:'GEN008', name:'Ember',   number:'08/23'},
      {id:'GEN009', name:'Sprout',  number:'09/23'},
      {id:'GEN010', name:'Ziggy',   number:'10/23'},
      {id:'GEN011', name:'Rune',    number:'11/23'},
      {id:'GEN012', name:'Oat',     number:'12/23'},
      {id:'GEN013', name:'Cricket', number:'13/23'},
      {id:'GEN014', name:'Jasper',  number:'14/23'},
      {id:'GEN015', name:'Twig',    number:'15/23'},
      {id:'GEN016', name:'Nico',    number:'16/23'},
      {id:'GEN017', name:'Cinder',  number:'17/23'},
      {id:'GEN018', name:'Blink',   number:'18/23'},
      {id:'GEN019', name:'Hazel',   number:'19/23'},
      {id:'GEN020', name:'Echo',    number:'20/23'},
      {id:'GEN021', name:'Finch',   number:'21/23'},
      {id:'GEN022', name:'Copper',  number:'22/23'},
      {id:'GEN023', name:'Orion',   number:'23/23'}
    ];

    // Build DOM rows cleanly (attach data-id for robust matching by kobblin id)
    function buildGenesisList() {
      const container = document.getElementById('genesis');
      if (!container) return;
      container.innerHTML = ''; // start fresh

      genesisKobblins.forEach(k => {
        const row = document.createElement('div');
        row.className = 'kobblin-row';

        const thumb = document.createElement('div');
        thumb.className = 'kobblin-thumb';
        thumb.id = 'thumb-' + k.id;            // use ID-based ids
        thumb.dataset.id = k.id;

        const nameEl = document.createElement('span');
        nameEl.className = 'kobblin-name';
        nameEl.id = 'name-' + k.id;           // use ID-based ids
        nameEl.dataset.id = k.id;
        nameEl.textContent = '<undiscovered>';

        const num = document.createElement('span');
        num.className = 'kobblin-number';
        num.textContent = k.number;

        row.appendChild(thumb);
        row.appendChild(nameEl);
        row.appendChild(num);

        container.appendChild(row);
      });
    }

    // Run builder immediately so DOM is well-formed before data fetch
    buildGenesisList();

    // Update discovered state from the DB (now matches by kobblin id which is reliable)
    (async function updateFromDB(){
      const SUPABASE_URL = 'https://ojkziqfqokifxmobmzcv.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_2qU46FYMyWxCmomlkikmAQ_WomS8c0Q';
      try {
        // request id and name and discovered fields
        const res = await fetch(`${SUPABASE_URL}/rest/v1/kobblins?select=id,name,discovered,last_discovered_at`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const rows = await res.json();
        console.debug('updateFromDB returned rows:', rows);

        rows.forEach(r => {
          console.debug('processing row:', r);
          const kid = String(r.id || '').trim();
          const name = (r.name || '').trim();
          if (!kid) return;

          // match DOM by id attribute we set earlier
          const elName = document.getElementById('name-' + kid) || document.querySelector('.kobblin-name[data-id="' + kid + '"]');
          const thumb = document.getElementById('thumb-' + kid) || document.querySelector('.kobblin-thumb[data-id="' + kid + '"]');
          console.debug('matched elements for id=' + kid + ' name=' + name, { elName: !!elName, thumb: !!thumb });

          if (!elName || !thumb) {
            console.debug('NO DOM match for', kid, name, 'skipping update');
            return;
          }

          if (r.discovered) {
            // update display name to the canonical DB name
            elName.textContent = name || elName.textContent;

            // thumbnail fallback: slug-based local image
            const slug = slugFromName(name || kid);
            let imageUrl = `images/${slug}.png`;

            try {
              thumb.style.backgroundImage = `url("${imageUrl}")`;
              thumb.style.backgroundSize = 'cover';
            } catch (e) {
              thumb.style.backgroundImage = '';
            }

            // add timestamp if available
            if (r.last_discovered_at) {
              let tsEl = document.getElementById('discovered-at-' + kid);
              if (!tsEl) {
                tsEl = document.createElement('span');
                tsEl.id = 'discovered-at-' + kid;
                tsEl.className = 'discovered-at';
                elName.parentNode.insertBefore(tsEl, elName.nextSibling);
              }
              tsEl.textContent = ` • found ${new Date(r.last_discovered_at).toLocaleString()}`;
            }

            // ensure its collection is open so users can see discovered items (optional)
            // const collection = elName.closest('.collection'); if (collection) collection.classList.add('open');

          } else {
            elName.textContent = '<undiscovered>';
            thumb.style.backgroundImage = '';
            const tsEl = document.getElementById('discovered-at-' + kid);
            if (tsEl) tsEl.remove();
          }
        });
      } catch (err) {
        console.error('Error loading kobblins for catalog:', err);
      }
    })();

    // Ensure collections start collapsed and make headers keyboard-accessible
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.collection').forEach(col => {
        col.classList.remove('open');
        const header = col.querySelector('.collection-header');
        if (header) header.setAttribute('aria-expanded', 'false');
        const list = col.querySelector('.kobblin-list');
        if (list) list.style.display = '';
      });

      document.querySelectorAll('.collection-header').forEach(header => {
        header.setAttribute('role','button');
        header.setAttribute('tabindex','0');
        header.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const list = header.closest('.collection').querySelector('.kobblin-list');
            if (list && list.id) toggleList(list.id);
          }
        });
      });
    });
  </script>

</body>
</html>
