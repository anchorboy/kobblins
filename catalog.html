<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kobblins Catalog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Insert Supabase library here -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- Global Header -->
  <header class="site-header">
    <a href="index.html" class="home-link">
      <h1>Kobblins</h1>
      <img src="images/kobblin.png" alt="Kobblin mascot" class="kobblin-img">
    </a>

    <p class="tagline"><em>A world of hidden painted rocks waiting to be discovered.</em></p>

    <nav class="navbar">
      <a href="about.html">About</a>
      <a href="catalog.html">Catalog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <!-- Genesis Collection -->
    <div class="collection">
      <div class="collection-header" onclick="toggleList('genesis')">
        <div class="collection-title">Genesis</div>
        <p class="collection-subtitle"><em>The launch collection (Fall 2026).</em></p>
      </div>

      <div id="genesis" class="kobblin-list"></div>

    </div>

    <!-- Apingaut Collection -->
    <div class="collection">
      <div class="collection-header" onclick="toggleList('apingaut')">
        <div class="collection-title">Apingaut (The First Snow)</div>
        <p class="collection-subtitle"><em>Winter 2026 collection.</em></p>
      </div>

      <div id="apingaut" class="kobblin-list">
        <p>(Add kobblins later)</p>
      </div>
    </div>

    <!-- Rogues Gallery #1 -->
    <div class="collection">
      <div class="collection-header" onclick="toggleList('rogues')">
        <div class="collection-title">Rogues Gallery #1</div>
        <p class="collection-subtitle"><em>A collection of Kobblins up to no good.</em></p>
      </div>

      <div id="rogues" class="kobblin-list">
        <p>(Add kobblins later)</p>
      </div>
    </div>

  </main>

  <script>
  // 1. Toggle function defined immediately so clicks work instantly
  function toggleList(id) {
    const list = document.getElementById(id);
    if (!list) return;
    const collection = list.closest('.collection');
    if (!collection) return;
    const isOpen = collection.classList.toggle('open');
    const header = collection.querySelector('.collection-header');
    if (header) header.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  }

  // 2. Initialize Supabase Client
  const SUPABASE_URL = 'https://ojkziqfqokifxmobmzcv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_2qU46FYMyWxCmomlkikmAQ_WomS8c0Q';
  let _supabase = null;

  if (window.supabase) {
    _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  // 3. Fetch live Kobblins from Supabase and render rows
  async function loadCatalog() {
    if (!_supabase) {
      console.warn('Supabase client not initialized.');
      return;
    }

    const { data: kobblins, error } = await _supabase
      .from('kobblins')
      .select('*')
      .order('c_num', { ascending: true });

    if (error) {
      console.error('Error fetching catalog:', error);
      return;
    }

    const genesisContainer = document.getElementById('genesis');
    if (!genesisContainer) return;
    genesisContainer.innerHTML = '';

    kobblins.forEach(k => {
      if (k.collection && k.collection.toLowerCase() === 'genesis') {
        const row = document.createElement('div');
        row.className = 'kobblin-row';

        // Thumbnail Image
        const thumb = document.createElement('div');
        thumb.className = 'kobblin-thumb';
        if (k.discovered) {
          const img = document.createElement('img');
          img.src = `images/kobblins/${k.id.toLowerCase()}.png`;
          img.alt = k.name;
          thumb.appendChild(img);
        } else {
          thumb.style.background = '#b0a493';
        }

        // Name & Discovery Timestamp
        const nameEl = document.createElement('span');
        nameEl.className = 'kobblin-name';
        nameEl.textContent = k.discovered ? k.name : '???';

        if (k.discovered && k.last_discovered_at) {
          const dateEl = document.createElement('small');
          dateEl.className = 'discovered-at';
          const formattedDate = new Date(k.last_discovered_at).toLocaleDateString();
          dateEl.textContent = `Found: ${formattedDate}`;
          nameEl.appendChild(dateEl);
        }

        // Catalog Number (e.g. 01/23)
        const num = document.createElement('span');
        num.className = 'kobblin-number';
        const numPadded = String(k.c_num).padStart(2, '0');
        num.textContent = `${numPadded}/23`;

        row.appendChild(thumb);
        row.appendChild(nameEl);
        row.appendChild(num);
        genesisContainer.appendChild(row);
      }
    });
  }

  // Run catalog load on startup
  loadCatalog();

  // Keyboard accessibility
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.collection').forEach(col => {
      col.classList.remove('open');
      const header = col.querySelector('.collection-header');
      if (header) header.setAttribute('aria-expanded', 'false');
    });

    document.querySelectorAll('.collection-header').forEach(header => {
      header.setAttribute('role', 'button');
      header.setAttribute('tabindex', '0');
      header.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          const list = header.closest('.collection').querySelector('.kobblin-list');
          if (list && list.id) toggleList(list.id);
        }
      });
    });
  });
</script>

</body>
</html>
