<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kobblins</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- Global Header -->
  <header class="site-header">
    <a href="index.html" class="home-link">
      <h1>Kobblins</h1>
      <img src="images/kobblin.png" alt="Kobblin mascot" class="kobblin-img">
    </a>

    <p class="tagline"><em>A world of hidden painted rocks waiting to be discovered.</em></p>

    <nav class="navbar">
      <a href="about.html">About</a>
      <a href="catalog.html">Catalog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Reset Button -->
    <button id="reset-btn" class="reset-button">Reset All Kobblins</button>
  </main>

  <!-- Popup Window -->
  <div id="kobblin-popup" class="popup-overlay">
    <div class="popup-box">
      <button class="popup-close" onclick="closePopup()">✕</button>
      <h2 id="popup-name"></h2>
      <img id="popup-image" class="popup-image" src="" alt="Kobblin">
      <div class="popup-info">
        <span id="popup-collection" class="popup-collection"></span>
        <span id="popup-number" class="popup-number"></span>
      </div>
    </div>
  </div>

  <script>
  function closePopup() {
    document.getElementById('kobblin-popup').style.display = 'none';
  }

  // Read the URL parameters when the page loads
  const urlParams = new URLSearchParams(window.location.search);
  const claimToken = urlParams.get('claim');

  // If a claim token is found, run a quick test
  if (claimToken) {
    console.log('Found secret claim token:', claimToken);
    alert('Scanned code detected: ' + claimToken);
  }

  // Reset button
  document.getElementById('reset-btn').addEventListener('click', () => {
    localStorage.clear();
    alert('All Kobblins reset!');
  });
</script>

</body>
</html>
