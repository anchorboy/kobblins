<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Disable caching so the homepage always loads fresh -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Kobblins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Global Header -->
  <header class="site-header">
    <a href="index.html" class="home-link">
      <h1>Kobblins</h1>
      <img src="images/kobblin.png" alt="Kobblin mascot" class="kobblin-img">
    </a>

    <p class="tagline"><em>A world of hidden painted rocks waiting to be discovered.</em></p>

    <nav class="navbar">
      <a href="about.html">About</a>
      <a href="catalog.html">Catalog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Reset Button -->
    <button id="reset-btn" class="reset-button">Reset All Kobblins</button>
  </main>

  <!-- Popup Window -->
  <div id="kobblin-popup" class="popup-overlay">
    <div class="popup-box">
      <button class="popup-close" onclick="closePopup()">✕</button>
      <h2 id="popup-name"></h2>
      <img id="popup-image" class="popup-image" src="" alt="Kobblin">
      <div class="popup-info">
        <span id="popup-collection" class="popup-collection"></span>
        <span id="popup-number" class="popup-number"></span>
      </div>
    </div>
  </div>

  <!-- Supabase + Kobblins loader -->
  <!-- Replace SUPABASE_URL and SUPABASE_ANON_KEY placeholders with your project's values -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js"></script>
  <script>
    // CONFIG - replace these placeholders with your values
    const SUPABASE_URL = 'SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'SUPABASE_ANON_KEY';
    // Use the exact table name you have in Supabase
    const TABLE_NAME = 'Kobblins Database';

    // Create Supabase client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Data maps
    let kobblinData = {};       // keyed by exact name
    let kobblinDataLower = {};  // keyed by lowercase name for case-insensitive lookup

    // Utility: create slug from name for image filenames
    function slugFromName(name) {
      return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    // Load kobblins from Supabase
    async function loadKobblins() {
      try {
        const { data: rows, error } = await supabaseClient
          .from(TABLE_NAME)
          .select('*');

        if (error) {
          console.error('Supabase error:', error);
          return;
        }

        kobblinData = {};
        kobblinDataLower = {};

        rows.forEach(r => {
          const name = (r.NAME || r.name || '').toString().trim();
          if (!name) return;

          // Determine image and thumbnail paths. Since you store images in the repo,
          // we generate predictable filenames from the NAME value.
          const slug = slugFromName(name);
          // Main image: images/<slug>.png
          // Thumbnail: images/thumbs/<slug>.png
          const image = r.image || r.IMAGE || `images/${slug}.png`;
          const thumbnail = r.thumbnail || r.thumbnail || `images/thumbs/${slug}.png`;

          // Use display number: prefer O NUM. (o_num, O_NUM, or O_NUM.) then C NUM
          const number = r['O NUM.'] ?? r.o_num ?? r.ONUM ?? r['O_NUM'] ?? r['C NUM'] ?? r.c_num ?? '';

          const collection = r.COLLECTION ?? r.collection ?? '';

          const obj = {
            collection,
            number: number,
            image,
            thumbnail
          };

          kobblinData[name] = obj;
          kobblinDataLower[name.toLowerCase()] = obj;
        });

        // After loading, handle URL param for popup
        handleUrlParam();
      } catch (err) {
        console.error('Error loading Kobblins from Supabase:', err);
      }
    }

    // Show popup if ?kobblin=NAME is present
    function handleUrlParam() {
      const params = new URLSearchParams(window.location.search);
      const foundParam = params.get('kobblin');
      if (!foundParam) return;

      const key = foundParam.trim();
      const k = kobblinData[key] || kobblinDataLower[key.toLowerCase()];
      if (!k) return;

      document.getElementById('popup-name').textContent = key;
      document.getElementById('popup-image').src = k.image || '';
      document.getElementById('popup-collection').textContent = k.collection || '';
      document.getElementById('popup-number').textContent = k.number || '';
      document.getElementById('kobblin-popup').style.display = 'flex';

      // Mark discovered locally
      localStorage.setItem(key, 'discovered');
    }

    function closePopup() {
      document.getElementById('kobblin-popup').style.display = 'none';
    }

    // Reset button (unchanged behavior)
    document.getElementById('reset-btn').addEventListener('click', () => {
      localStorage.clear();
      alert('All Kobblins reset! You can test QR codes again.');
    });

    // Load kobblins after DOM ready
    window.addEventListener('DOMContentLoaded', loadKobblins);

  </script>

</body>
</html>
