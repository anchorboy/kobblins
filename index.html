<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kobblins</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- Global Header -->
  <header class="site-header">
    <a href="index.html" class="home-link">
      <h1>Kobblins</h1>
      <img src="images/kobblin.png" alt="Kobblin mascot" class="kobblin-img">
    </a>

    <p class="tagline"><em>A world of hidden painted rocks waiting to be discovered.</em></p>

    <nav class="navbar">
      <a href="about.html">About</a>
      <a href="catalog.html">Catalog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Reset Button -->
    <button id="reset-btn" class="reset-button">Reset All Kobblins</button>
  </main>

  <!-- Popup Window -->
  <div id="kobblin-popup" class="popup-overlay">
    <div class="popup-box">
      <button class="popup-close" onclick="closePopup()">✕</button>
      <h2 id="popup-name"></h2>
      <img id="popup-image" class="popup-image" src="" alt="Kobblin">
      <div class="popup-info">
        <span id="popup-collection" class="popup-collection"></span>
        <span id="popup-number" class="popup-number"></span>
      </div>
    </div>
  </div>

  <script>
  // 1. Initialize Supabase Client (using your credentials from catalog.html)
  const SUPABASE_URL = 'https://ojkziqfqokifxmobmzcv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_2qU46FYMyWxCmomlkikmAQ_WomS8c0Q';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function closePopup() {
    document.getElementById('kobblin-popup').style.display = 'none';
  }

  async function handleClaim(token) {
    // Call Supabase function to claim the Kobblin
    const { data, error } = await _supabase.rpc('claim_kobblin', { token_input: token });

    if (error || !data || data.length === 0) {
      console.error('Claim error:', error);
      alert('Invalid or missing Kobblin code.');
      return;
    }

    const claimed = data[0];

    // Populate popup modal elements
    document.getElementById('popup-name').textContent = 'You found ' + claimed.name + '!';
    document.getElementById('popup-image').src = 'images/kobblins/' + claimed.id.toLowerCase() + '.png';
    document.getElementById('popup-collection').textContent = claimed.collection;
    document.getElementById('popup-number').textContent = '#' + String(claimed.c_num).padStart(2, '0');

    // Display modal popup overlay
    document.getElementById('kobblin-popup').style.display = 'flex';
  }

  // 2. Check URL parameters on page load
  const urlParams = new URLSearchParams(window.location.search);
  const claimToken = urlParams.get('claim');

  if (claimToken) {
    handleClaim(claimToken);
  }

  // Reset button
  document.getElementById('reset-btn').addEventListener('click', () => {
    localStorage.clear();
    alert('Local cache reset!');
  });
</script>

</body>
</html>
