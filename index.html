<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Disable caching so the homepage always loads fresh -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Kobblins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Global Header -->
  <header class="site-header">
    <a href="index.html" class="home-link">
      <h1>Kobblins</h1>
      <img src="images/kobblin.png" alt="Kobblin mascot" class="kobblin-img">
    </a>

    <p class="tagline"><em>A world of hidden painted rocks waiting to be discovered.</em></p>

    <nav class="navbar">
      <a href="about.html">About</a>
      <a href="catalog.html">Catalog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Reset Button -->
    <button id="reset-btn" class="reset-button">Reset All Kobblins</button>
  </main>

  <!-- Unified Popup -->
  <div id="kobblin-popup" class="popup-overlay">
    <div class="popup-box">

      <!-- Congratulations Banner -->
      <div class="congrats-banner">
        <p>Congratulations! You've found a Kobblin.<br>It will be automatically cataloged.</p>
      </div>

      <button class="popup-close" onclick="closePopup()">✕</button>

      <h2 id="popup-name"></h2>
      <img id="popup-image" class="popup-image" src="" alt="Kobblin">

      <div class="popup-info">
        <span id="popup-collection" class="popup-collection"></span>
        <span id="popup-number" class="popup-number"></span>
      </div>

    </div>
  </div>

  <script>
    /* ----------------------------------------------------
       FULL GENESIS KOBBLIN DATA (23 kobblins)
       ---------------------------------------------------- */
    const kobblinData = {
      Glimmer: { collection: "Genesis", number: "01/23", image: "images/glimmer.png" },
      Pebble: { collection: "Genesis", number: "02/23", image: "images/pebble.png" },
      Milo: { collection: "Genesis", number: "03/23", image: "images/milo.png" },
      Mossy: { collection: "Genesis", number: "04/23", image: "images/mossy.png" },
      Pip: { collection: "Genesis", number: "05/23", image: "images/pip.png" },
      Bramble: { collection: "Genesis", number: "06/23", image: "images/bramble.png" },
      Flint: { collection: "Genesis", number: "07/23", image: "images/flint.png" },
      Ember: { collection: "Genesis", number: "08/23", image: "images/ember.png" },
      Sprout: { collection: "Genesis", number: "09/23", image: "images/sprout.png" },
      Ziggy: { collection: "Genesis", number: "10/23", image: "images/ziggy.png" },
      Rune: { collection: "Genesis", number: "11/23", image: "images/rune.png" },
      Oat: { collection: "Genesis", number: "12/23", image: "images/oat.png" },
      Cricket: { collection: "Genesis", number: "13/23", image: "images/cricket.png" },
      Jasper: { collection: "Genesis", number: "14/23", image: "images/jasper.png" },
      Twig: { collection: "Genesis", number: "15/23", image: "images/twig.png" },
      Nico: { collection: "Genesis", number: "16/23", image: "images/nico.png" },
      Cinder: { collection: "Genesis", number: "17/23", image: "images/cinder.png" },
      Blink: { collection: "Genesis", number: "18/23", image: "images/blink.png" },
      Hazel: { collection: "Genesis", number: "19/23", image: "images/hazel.png" },
      Echo: { collection: "Genesis", number: "20/23", image: "images/echo.png" },
      Finch: { collection: "Genesis", number: "21/23", image: "images/finch.png" },
      Copper: { collection: "Genesis", number: "22/23", image: "images/copper.png" },
      Orion: { collection: "Genesis", number: "23/23", image: "images/orion.png" }
    };

    /* ----------------------------------------------------
       POPUP TRIGGER VIA QR CODE (?kobblin=NAME)
       ---------------------------------------------------- */
    const params = new URLSearchParams(window.location.search);
    const found = params.get("kobblin");

    if (found && kobblinData[found]) {
      const k = kobblinData[found];

      // Fill popup
      document.getElementById("popup-name").textContent = found;
      document.getElementById("popup-image").src = k.image;
      document.getElementById("popup-collection").textContent = k.collection;
      document.getElementById("popup-number").textContent = k.number;

      // Show popup
      document.getElementById("kobblin-popup").style.display = "flex";

      // Mark as discovered
      localStorage.setItem(found, "discovered");
    }

    function closePopup() {
      document.getElementById("kobblin-popup").style.display = "none";
    }

    /* Close popup when clicking outside the box */
    document.getElementById("kobblin-popup").addEventListener("click", (e) => {
      if (e.target === document.getElementById("kobblin-popup")) {
        closePopup();
      }
    });

    /* ----------------------------------------------------
       RESET BUTTON — CLEAR ALL DISCOVERED KOBBLINS
       ---------------------------------------------------- */
    document.getElementById("reset-btn").addEventListener("click", () => {
      localStorage.clear();
      alert("All Kobblins reset! You can test QR codes again.");
    });
  </script>

</body>
</html>
