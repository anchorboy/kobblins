<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kobblins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Global Header -->
  <header class="site-header">
    <a href="index.html" class="home-link">
      <h1>Kobblins</h1>
      <img src="images/kobblin.png" alt="Kobblin mascot" class="kobblin-img">
    </a>

    <p class="tagline"><em>A world of hidden painted rocks waiting to be discovered.</em></p>

    <nav class="navbar">
      <a href="about.html">About</a>
      <a href="catalog.html">Catalog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main></main>

  <!-- Popup Window -->
  <div id="kobblin-popup" class="popup-overlay">
    <div class="popup-box">
      <button class="popup-close" onclick="closePopup()">✕</button>
      <h2 id="popup-name"></h2>
      <img id="popup-image" class="popup-image" src="" alt="Kobblin">
      <div class="popup-info">
        <span id="popup-collection" class="popup-collection"></span>
        <span id="popup-number" class="popup-number"></span>
      </div>
    </div>
  </div>

  <script>
    // Detect QR scan via URL parameter
    const params = new URLSearchParams(window.location.search);
    const found = params.get("kobblin");

    if (found) {
      // Example data — later this will be dynamic
      const kobblinData = {
        Glimmer: { collection: "Genesis", number: "01/23", image: "images/glimmer.png" },
        Pebble: { collection: "Genesis", number: "02/23", image: "images/pebble.png" },
        // Add all kobblins here later
      };

      const k = kobblinData[found];

      if (k) {
        document.getElementById("popup-name").textContent = found;
        document.getElementById("popup-image").src = k.image;
        document.getElementById("popup-collection").textContent = k.collection;
        document.getElementById("popup-number").textContent = k.number;

        document.getElementById("kobblin-popup").style.display = "flex";

        // Save discovery
        localStorage.setItem(found, "discovered");
      }
    }

    function closePopup() {
      document.getElementById("kobblin-popup").style.display = "none";
    }
  </script>

</body>
</html>
